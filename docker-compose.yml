services:
  agent:
    build: .
    ports:
      - "8080:8080" # WhatsApp webhook listens on :8080 by default
    environment:
      - FIVEAGENT_CONFIG=/config/fiveagent.yml
      # Expands ${DB_PASSWORD} inside fiveagent.yml (config.Load expands
      # ${VAR} from the environment); must match the db service below.
      - DB_PASSWORD=${DB_PASSWORD:-fiveagent}
    volumes:
      - ./fiveagent.yml:/config/fiveagent.yml:ro
      - fiveagent-workspace:/workspace
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=fiveagent
      - POSTGRES_PASSWORD=${DB_PASSWORD:-fiveagent}
      - POSTGRES_DB=fiveagent
    volumes:
      - fiveagent-db:/var/lib/postgresql/data
    restart: unless-stopped

  browser:
    image: mcr.microsoft.com/playwright:v1.48.0-jammy
    command: ["npx", "playwright", "run-server", "--port", "3000"]
    restart: unless-stopped

volumes:
  fiveagent-workspace:
  fiveagent-db:
