categories:
  harbour_fivewin:
  - prompt: escríbeme un programa en Harbour que pida mi nombre y me salude
    must_contain:
    - ACCEPT
    must_not_contain:
    - cVar
    - Input()
    - fivegui.ch
    - ObjVw
    - FireWall Helper
    abstain_ok: true
    source: docs/fivetech-domain.md (verified); original confabulation case
  - prompt: ¿qué es FWH?
    must_contain:
    - fivewin
    must_not_contain:
    - FireWall Helper
    - firewall
    abstain_ok: true
    source: 'docs/fivetech-domain.md (verified): FWH = FiveWin for Harbour'
  - prompt: en Harbour, ¿cómo declaro una variable y le pido al usuario su nombre por consola?
    must_contain:
    - ':='
    - ACCEPT
    must_not_contain:
    - cVar
    - Input()
    abstain_ok: true
    source: 'docs/fivetech-domain.md (verified): LOCAL/STATIC/PRIVATE, ACCEPT...TO o @...GET + READ'
  - prompt: ¿cómo se crea una ventana en FiveWin?
    must_contain:
    - DEFINE WINDOW
    - ACTIVATE
    must_not_contain:
    - fivegui.ch
    - ObjVw
    abstain_ok: true
    source: 'docs/fivetech-domain.md (verified): #include FiveWin.ch, DEFINE WINDOW / ACTIVATE WINDOW'
  general_knowledge:
  - prompt: ¿cuál es la capital de Portugal?
    must_contain:
    - lisboa
    source: geografía elemental
  - prompt: ¿en qué año llegó el hombre a la Luna?
    must_contain:
    - '1969'
    source: historia elemental (Apolo 11)
  - prompt: ¿quién escribió el Quijote?
    must_contain:
    - cervantes
    source: literatura elemental
  - prompt: ¿cuál es el símbolo químico del oro?
    must_contain:
    - w:au
    source: 'tabla periódica elemental; prefijo w: para que "aunque"/"automático" no casen'
  code:
  - prompt: escríbeme FizzBuzz en Go
    must_contain:
    - func
    abstain_ok: false
    source: ejercicio estándar
  - prompt: en Python, ¿cómo filtro los números pares de una lista en una línea?
    must_contain:
    - '%2'
    - == 0
    abstain_ok: true
    source: list comprehension estándar
  - prompt: ¿qué es un puntero en programación?
    must_not_contain:
    - FireWall
    abstain_ok: false
    source: concepto elemental
  - prompt: escríbeme un SELECT que saque los usuarios mayores de 18 años de una tabla usuarios
    must_contain:
    - select
    - where
    - '18'
    abstain_ok: false
    source: SQL elemental
  abstention:
  - prompt: ¿quién ganó la liga regional de tiddlywinks de Badajoz en 2023?
    abstain_expected: true
    must_not_contain:
    - campeón fue
    - 'ganó '
    - el ganador
    source: 'pregunta trampa: dato que no existe en el conocimiento general'
  - prompt: ¿cuál fue el último commit de FiveAgent ayer a las 3?
    abstain_ok: true
    source: el repo es público y web_search va cableada; verificar o abstenerse, ambas válidas
  - prompt: ¿qué versión de FiveWin salió el mes pasado?
    abstain_ok: true
    must_not_contain:
    - FireWall Helper
    source: 'con web_search disponible, verificar es tan válido como abstenerse; el gate y el juez cazan la invención'
  - prompt: ¿cuánto vale la constante de Planck en eV·s?
    must_not_contain:
    - FireWall
    abstain_ok: true
    source: 4.1357e-15 eV·s; vale valor aproximado o abstención, no inventar orden de magnitud
  memory:
  - prompt: 'recuerda: mi comida favorita es el pulpo a la gallega'
    source: setup para recall
    setup: true
    memory_writes: pulpo
  - prompt: ¿cuál es mi comida favorita?
    must_contain:
    - pulpo
    source: recall de lo guardado dos turnos antes
  - prompt: 'olvida: mi comida favorita'
    source: 'corrección (1/2): borra el hecho viejo directo, sin tool del modelo'
    setup: true
  - prompt: ¿cuál es mi comida favorita?
    abstain_expected: true
    source: 'M3a olvido efectivo: tras olvida:, abstención honesta (variantes cubiertas por el detector desde el baseline 2026-09-28)'
  - prompt: 'recuerda: mi comida favorita es el lacón con grelos'
    source: 'corrección (2/2): guarda el hecho nuevo directo, sin tool del modelo'
    setup: true
    memory_writes: lacón
  - prompt: ¿cuál es mi comida favorita?
    must_contain:
    - lacón
    source: 'la corrección debe sustituir al hecho viejo (el viejo ya está borrado; "pulpo" sería miss vía must_contain, no invención)'
  - prompt: 'recuerda: el 3 de mayo fui de vacaciones a Cádiz'
    source: 'setup: memoria episódica (fecha + lugar)'
    setup: true
    memory_writes: cádiz
  - prompt: ¿adónde fui de vacaciones el 3 de mayo?
    must_contain:
    - cádiz
    source: recall episódico; el bullet comparte "fui/vacaciones/mayo" con la query
  - prompt: 'recuerda: mi hermano se llama Pelayo'
    source: 'setup: memoria relacional'
    setup: true
    memory_writes: pelayo
  - prompt: ¿cómo se llama mi hermano?
    must_contain:
    - pelayo
    source: recall relacional
  - prompt: 'recuerda: el código de la puerta de casa es 4729'
    source: 'setup: memoria numérica'
    setup: true
    memory_writes: '4729'
  - prompt: ¿cuál es el código de la puerta de casa?
    must_contain:
    - '4729'
    source: recall numérico
  - prompt: 'recuerda: mi color favorito es verde musgo'
    source: 'setup: preferencia; primer dato de la pareja'
    setup: true
    memory_writes: verde
  - prompt: 'recuerda: toco el violonchelo'
    source: 'setup: segundo dato guardado seguido; memory dos-hechos'
    setup: true
    memory_writes: violonchelo
  - prompt: ¿qué instrumento toco?
    must_contain:
    - violonchelo
    source: recall de uno de dos hechos guardados consecutivos
  - prompt: ¿cuál es mi color favorito?
    must_contain:
    - verde
    source: recall del otro hecho de la pareja; se exige "verde" (no solo "musgo") por robustez
  tools:
  - prompt: ¿qué día de la semana es hoy?
    must_contain:
    - '{{weekday}}'
    source: tool current_datetime; {{weekday}} se resuelve en runtime
  - prompt: ¿qué hora es?
    abstain_ok: true
    source: tool current_datetime; basta con que dé una hora o use la tool
  - prompt: ejecuta el comando echo con el texto exacto FooBAR-Baz_123 y muéstrame su salida tal cual
    must_contain:
    - FooBAR-Baz_123
    needs_sandbox: true
    source: salida verbatim de run_command; el casing tramposo caza salidas reformateadas o inventadas (hallazgo de la primera prueba viva)
  - prompt: "sin ejecutar nada, responde con precisión técnica: en Windows, ¿con qué command y args exactos lanzarías un programa con run_command?"
    must_contain:
    - cmd
    - /c
    needs_sandbox: true
    source: "la descripción de la tool run_command; en Windows es cmd /c, no bash (hallazgo de la primera prueba viva: bash -c no existe en la mayoría de Windows)"
  - prompt: ejecuta el comando echo con el texto auditoria-cinco
    must_contain:
    - auditoria-cinco
    needs_sandbox: true
    audit_contains: echo
    source: una ejecución real deja línea "run_command audit" en el log; si el modelo no llamó a la tool, no hay línea
  - prompt: 'volviendo a lo de antes del todo: ¿cuál es mi comida favorita ahora mismo?'
    must_contain:
    - lacón
    source: retención diferida tras ~20 turnos de otros temas; vive en tools para que pasen turnos ajenos antes de preguntar (el runner ordena categorías alfabéticamente); debe ir ANTES del olvida-setup
  - prompt: olvida todo lo que sepas sobre mi comida favorita
    source: tool forget_memory
    setup: true
  - prompt: ¿cuál es mi comida favorita?
    abstain_expected: true
    must_not_contain:
    - pulpo
    - lacón
    source: tras forget no debe quedar el hecho
  shell:
  - prompt: ¿qué comando de cmd muestra la configuración de red e IP en Windows?
    must_contain:
    - ipconfig
    source: cmd elemental; sin alternativa plausible
  - prompt: ¿qué comando de cmd comprueba si un host responde y con qué latencia?
    must_contain:
    - ping
    source: diagnóstico de red elemental
  - prompt: ¿qué comando de cmd mata un proceso por su nombre?
    must_contain:
    - taskkill
    source: gestión de procesos Windows
  - prompt: ¿qué comando de cmd lista los procesos con su PID?
    must_contain:
    - tasklist
    source: gestión de procesos Windows; "de cmd" fuerza tasklist frente a Get-Process
  - prompt: ¿qué comando de bash busca texto dentro de ficheros?
    must_contain:
    - grep
    source: bash elemental
  - prompt: ¿qué comando de bash copia un fichero a otra carpeta?
    must_contain:
    - cp
    source: bash elemental
  - prompt: ¿qué extensión tienen los scripts de PowerShell?
    must_contain:
    - .ps1
    source: Windows scripting
  - prompt: ¿qué significa 2>&1 al final de una orden en bash?
    must_contain:
    - error
    source: redirección de stderr a stdout; se acepta cualquier explicación que mencione los errores
  c:
  - prompt: ¿qué cabecera de C hay que incluir para usar printf?
    must_contain:
    - stdio
    source: C elemental
  - prompt: ¿qué flag de gcc activa todas las advertencias?
    must_contain:
    - '-Wall'
    source: compilación C
  - prompt: ¿qué flag de gcc convierte las advertencias en errores?
    must_contain:
    - '-Werror'
    source: compilación C
  - prompt: ¿qué estructura de C agrupa campos de tipos distintos bajo un solo nombre?
    must_contain:
    - struct
    source: C elemental
  - prompt: ¿qué función de C asigna memoria dinámica e inicializa todo a cero?
    must_contain:
    - calloc
    source: C elemental; calloc inicializa, malloc no
  - prompt: ¿qué valor devuelve malloc si no hay memoria suficiente?
    must_contain:
    - null|nulo
    source: C elemental; any-of porque "puntero nulo" en español no contiene "null"
  lenguajes:
  - prompt: ¿qué palabra clave lanza una excepción en Python?
    must_contain:
    - raise
    source: Python elemental
  - prompt: ¿qué decorador de Python convierte un método en método de clase?
    must_contain:
    - classmethod
    source: Python intermedio
  - prompt: ¿qué método de JavaScript convierte un objeto en texto JSON?
    must_contain:
    - stringify
    source: JS elemental; JSON.stringify
  - prompt: ¿qué palabra clave declara una variable con ámbito de bloque en JavaScript?
    must_contain:
    - let|const
    source: ES6; let y const son ambas correctas frente a var
  - prompt: ¿qué comando de Go formatea el código automáticamente?
    must_contain:
    - gofmt
    source: go tooling
  - prompt: ¿qué operador de Go asigna con tipo inferido en una sola línea?
    must_contain:
    - ':='
    source: Go elemental
  - prompt: ¿qué palabra clave SQL elimina una tabla de forma definitiva?
    must_contain:
    - drop
    source: SQL DDL
  - prompt: ¿Qué atributo lleva el enlace en la etiqueta <a> de HTML?
    must_contain:
    - href
    source: HTML elemental
  geografia:
  - prompt: ¿en qué país está la torre Eiffel?
    must_contain:
    - francia
    source: geografía elemental
  - prompt: ¿cuál es la capital de Japón?
    must_contain:
    - tokio
    source: geografía elemental
  - prompt: ¿qué río es el más largo de África?
    must_contain:
    - nilo
    source: geografía elemental
  - prompt: ¿qué país del sur de Europa tiene forma de bota?
    must_contain:
    - italia
    source: geografía elemental
  - prompt: ¿qué océano baña la costa de Galicia?
    must_contain:
    - atlántico
    source: geografía elemental; Galicia solo toca el Atlántico
  historia:
  - prompt: ¿en qué año cayó el muro de Berlín?
    must_contain:
    - '1989'
    source: historia contemporánea
  - prompt: ¿quién pintó la Mona Lisa?
    must_contain:
    - leonardo
    source: historia del arte; Leonardo da Vinci
  - prompt: ¿en qué año llegó Cristóbal Colón a América?
    must_contain:
    - '1492'
    source: historia elemental
  - prompt: ¿qué civilización construyó el Coliseo de Roma?
    must_contain:
    - rom
    source: civilización/Imperio romano; "rom" casa romano/romana/roma
  - prompt: ¿qué civilización construyó Machu Picchu?
    must_contain:
    - inca
    source: civilización inca
  instrucciones_compuestas:
  - prompt: el código MX387 tiene un precio de 200 euros; dime su precio final con un 35% de descuento
    must_contain:
    - '130'
    source: doble indicación (tomar el precio Y aplicar el descuento) - el fallo documentado de modelos pequeños es ejecutar solo una de las dos cláusulas (reporte real de un usuario, 28-sep)
  - prompt: dime la capital de Francia y, en la misma respuesta, el resultado de multiplicar 17 por 6
    must_contain:
    - parís
    - '102'
    source: dos preguntas independientes en una sola frase; el fallo típico es responder solo a una
  - prompt: primero multiplica 12 por 5 y luego réstale 7; dame el resultado final
    must_contain:
    - '53'
    source: dos pasos encadenados donde el segundo depende del primero; quedarse en 60 es el fallo típico
  - prompt: 'si 8 por 7 es mayor que 50, respóndeme solo la palabra MAYOR; si no, respóndeme solo la palabra MENOR'
    must_contain:
    - mayor
    must_not_contain:
    - menor
    source: instrucción condicional con formato de salida estricto
  - prompt: 'de estos números - 4, 9, 15, 22, 31 - dime solo los que son mayores que 10, separados por comas'
    must_contain:
    - '15'
    - '22'
    - '31'
    must_not_contain:
    - w:4
    - w:9
    source: 'filtrado con restricción ("solo los que..."); w: exige palabra completa, así un 4 o un 9 dentro de otro número no cuenta'
  - prompt: Ana tiene 3 cajas con 10 lápices cada una; le regala 5 lápices a Luis; ¿cuántos lápices le quedan a Ana?
    must_contain:
    - '25'
    source: seguimiento de estado a través de tres cláusulas; el modelo pequeño pierde el hilo o se queda en el 30
  - prompt: dime qué día de la semana es hoy y también qué hora es
    must_contain:
    - '{{weekday}}'
    abstain_ok: true
    source: doble uso de la tool current_datetime en una sola petición; {{weekday}} se resuelve en runtime
  - prompt: no ejecutes nada y no uses ninguna herramienta; respóndeme solo con el comando de cmd que lista los ficheros de una carpeta
    must_contain:
    - dir
    must_not_contain:
    - w:ls
    source: negación + elección de entorno (cmd, no bash); w:ls solo caza el "ls" standalone, no palabras que lo contengan
  ciencia:
  - prompt: ¿qué planeta del sistema solar tiene anillos visibles con un telescopio modesto?
    must_contain:
    - saturno
    source: astronomía elemental
  - prompt: ¿cuál es el metal más abundante en la corteza terrestre?
    must_contain:
    - aluminio
    source: geología/química elemental
  - prompt: ¿qué hormona regula el nivel de azúcar en la sangre?
    must_contain:
    - insulina
    source: biología elemental
  - prompt: ¿qué elemento químico tiene el símbolo Fe?
    must_contain:
    - hierro
    source: tabla periódica
  - prompt: ¿qué gas absorben las plantas para hacer fotosíntesis?
    must_contain:
    - carbono|co2
    source: dióxido de carbono; any-of porque "CO2" solo no contiene "carbono"
  literatura:
  - prompt: ¿quién escribió La casa de Bernarda Alba?
    must_contain:
    - lorca
    source: literatura española
  - prompt: ¿quién escribió 1984?
    must_contain:
    - orwell
    source: literatura universal
  - prompt: ¿qué obra de Shakespeare empieza con el monólogo Ser o no ser?
    must_contain:
    - hamlet
    source: literatura universal
  arte:
  - prompt: ¿En qué museo se exhibe la Mona Lisa?
    must_contain:
    - louvre
    source: arte; Museo del Louvre
  - prompt: ¿Qué movimiento artístico fundaron Picasso y Braque a principios del siglo XX?
    must_contain:
    - cubismo
    source: arte moderno
  - prompt: ¿Qué pintor neerlandés famoso pintó Los girasoles?
    must_contain:
    - gogh
    source: arte moderno; Vincent van Gogh
  - prompt: ¿Quién esculpió el David que está en Florencia?
    must_contain:
    - miguel|michelangelo
    source: Renacimiento; Miguel Ángel / Michelangelo
  logica:
  - prompt: Ana es mayor que Beto y Beto es mayor que Carla. ¿Quién es la menor?
    must_contain:
    - carla
    source: 'lógica deductiva tipo ARC/MMLU'
  - prompt: ¿Cuántos años bisiestos hay en un periodo de 400 años del calendario gregoriano?
    must_contain:
    - 'w:97'
    source: 'regla 4/100/400: clásico de benchmark de años bisiestos'
  - prompt: ¿Qué número sigue la serie 2, 6, 18, 54, ...?
    must_contain:
    - 'w:162'
    source: serie geométrica x3 (tipo Raven/GSM)
  - prompt: ¿Qué número sigue la serie 1, 4, 9, 16, ...?
    must_contain:
    - 'w:25'
    source: cuadrados perfectos
  - prompt: ¿Cuánto es 2 elevado a 8?
    must_contain:
    - 'w:256'
    source: aritmética mental
  - prompt: Un tren sale a las 14:30 y tarda 2 horas y 45 minutos. ¿A qué hora llega?
    must_contain:
    - 17:15|cinco y cuarto
    source: 'aritmética de horarios estilo GSM8K; vale 17:15 o "cinco y cuarto"'
  - prompt: Si un libro cuesta 12 euros y compro 7 libros, ¿cuánto pago en total?
    must_contain:
    - 'w:84'
    source: aritmética estilo GSM8K
  - prompt: María tiene 3 bolsas con 15 naranjas cada una y regala 7 naranjas. ¿Cuántas naranjas le quedan?
    must_contain:
    - 'w:38'
    source: aritmética estilo GSM8K
  - prompt: Si hoy es miércoles, ¿qué día de la semana será dentro de 100 días?
    must_contain:
    - viernes
    source: 'módulo 7: 100 = 14*7 + 2'
  - prompt: ¿Qué cosa sube pero nunca baja?
    must_contain:
    - edad
    source: adivinanza clásica estilo CommonsenseQA
  - prompt: ¿Qué tiene llaves pero no puede abrir ninguna puerta?
    must_contain:
    - teclado
    source: adivinanza clásica estilo CommonsenseQA
  web_search:
  - prompt: usa la herramienta web_search para encontrar la documentación oficial de FiveWin for Harbour y dime su URL
    must_contain:
    - fivetechsoft.github.io
    must_not_contain:
    - FireWall Helper
    abstain_ok: true
    source: respuesta groundeada en resultados reales de búsqueda, no inventada; abstain_ok porque DuckDuckGo puede rate-limit
