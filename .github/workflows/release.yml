# Release (roadmap stage 6): pushing a v* tag builds the prebuilt
# binaries the README promises (Windows, Linux, macOS) and publishes
# them as a GitHub Release with SHA256 checksums. The v0.0.1 tag waits
# for battery run 6, so this workflow is verified through
# workflow_dispatch: a manual run exercises the build matrix and
# uploads artifacts, but the release job only publishes from a real tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: ""}
          - {goos: windows, goarch: amd64, ext: ".exe"}
          - {goos: darwin, goarch: amd64, ext: ""}
          - {goos: darwin, goarch: arm64, ext: ""}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build -trimpath -ldflags "-s -w"
          -o fiveagent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          ./app/fiveagent
      - name: Smoke check
        shell: bash
        run: |
          if [ "${{ matrix.goos }}" = "linux" ]; then
            ./fiveagent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} --help >/dev/null 2>&1 || true
            test -s fiveagent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          else
            test -s fiveagent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fiveagent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: fiveagent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    # Only a real tag publishes; workflow_dispatch verifies the builds
    # and leaves the artifacts on the run without cutting a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fiveagent-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum fiveagent-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fiveagent-*
            SHA256SUMS.txt
