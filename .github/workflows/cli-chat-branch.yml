# Branch-scoped checks + test-package build for feat/cli-chat. Runs the
# app package tests and builds the Windows chat CLI test package as a
# downloadable artifact. Not part of the main CI gate (ci.yml stays
# main/PR-scoped); no release, no tag.
name: cli-chat-branch

on:
  push:
    branches: [feat/cli-chat]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test app package
        run: go test ./app/... -count=1
      - name: Build Windows chat CLI
        run: GOOS=windows GOARCH=amd64 go build -trimpath -o fiveagent-chat.exe ./app/fiveagent
      - name: Assemble test package
        run: |
          mkdir -p FiveAgent-ChatTest
          cp fiveagent-chat.exe packaging/chat-test/LEEME.txt packaging/chat-test/fiveagent.yml FiveAgent-ChatTest/
          zip -r fiveagent-chat-windows-amd64.zip FiveAgent-ChatTest
          sha256sum fiveagent-chat-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fiveagent-chat-windows-amd64
          path: fiveagent-chat-windows-amd64.zip
          retention-days: 30
